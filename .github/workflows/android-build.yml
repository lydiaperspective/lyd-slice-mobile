name: Android build and test APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyd-slice-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare development release APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/lyd-slice-dev.apk

      - name: Move dev tag to this commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push origin refs/tags/dev --force

      - name: Publish development release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development build
          prerelease: true
          make_latest: false
          draft: false
          generate_release_notes: false
          files: dist/lyd-slice-dev.apk
          overwrite_files: true
          fail_on_unmatched_files: true
